name: Test

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "Test ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - uses: leafo/gh-actions-lua@v13
      with:
        luaVersion: "luajit-openresty"
    - uses: leafo/gh-actions-luarocks@v6
      with:
        luarocksVersion: "3.12.2"
    - run: luarocks install luacheck
    - run: luacheck lib

  run_tests:
    strategy:
      fail-fast: false
      matrix:
        openresty_version:
          - 1.21.4.4
          - 1.25.3.2
          - 1.27.1.2
          - 1.29.2.5
          - 1.31.1.1

    runs-on: ubuntu-latest
    container:
      image: openresty/openresty:${{ matrix.openresty_version }}-alpine-fat
      # --init runs tinit as PID 1 and prevents the 'WARNING: killing the child process' spam from the test suite
      options: --init

    steps:
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
        elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
        elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
        elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
        fi

    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Install deps
      run: |
        apk add --no-cache curl perl bash wget git perl-dev libarchive-tools nodejs build-base
        ln -s /usr/bin/bsdtar /usr/bin/tar

    - name: Install CPAN
      run: curl -s -L https://cpanmin.us | perl - App::cpanminus > /bin/cpanm && chmod +x /bin/cpanm

    - name: Cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cpan
          ~/.cache
        key: ${{ runner.os }}-${{ matrix.openresty_version }}-cache

    - name: Install Test::Nginx
      run: cpanm -q -n Test::Nginx

    - name: Install latest LuaRocks
      run: |
        case ${{ matrix.openresty_version }} in
        1.19.* | 1.21.*)
          # Remove old luarocks if exists
          rm -rf /usr/local/openresty/luajit/bin/luarocks* || true
          # Download and install latest LuaRocks
          cd /tmp
          wget https://luarocks.org/releases/luarocks-3.12.2.tar.gz
          tar zxpf luarocks-3.12.2.tar.gz
          cd luarocks-3.12.2
          ./configure --prefix=/usr/local/openresty/luajit \
                      --with-lua=/usr/local/openresty/luajit \
                      --lua-suffix=jit \
                      --with-lua-include=/usr/local/openresty/luajit/include/luajit-2.1
          make build && make install
          ;;
        *)
          echo "No Luarocks update required"
          ;;
        esac

    - name: Install Luacov
      run: |
        # Clear any existing cache
        rm -rf ~/.cache/luarocks || true
        /usr/local/openresty/luajit/bin/luarocks install luacov
        /usr/local/openresty/luajit/bin/luarocks install lua-resty-openssl

    - name: Run tests
      run: make coverage

    - name: Coverage
      run: |
        luacov
        tail -n 8 luacov.report.out
